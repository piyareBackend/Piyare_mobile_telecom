<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/admin/manifest.webmanifest"><title>PMT Admin Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>PMT Admin Login</h2><p style="margin:8px 0 18px;color:var(--gray)">Credentials are verified on the server, followed by a one-time verification code.</p><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" minlength="10" required style="width:100%;box-sizing:border-box"></div><button type="submit" class="btn btn-blue btn-full" style="margin-top:16px" id="submit">Sign in</button><p id="m" role="status" aria-live="polite" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Access is controlled server-side. OTPs are never returned by the API.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
const u=document.getElementById('u'),p=document.getElementById('p'),submit=document.getElementById('submit'),m=document.getElementById('m');const order=['dashboard','pos','billing','orders_view','repairs','customers','inventory_view','products_view','products_edit','website','banners','coupons','feedback','analytics','reports','media','settings','security','staff','backups'];const pages={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',products_edit:'product-editor-v2.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};function landing(x){if(String(x.role)==='Owner')return pages.dashboard;let q=x.permissions;if(typeof q==='string'){try{q=JSON.parse(q)}catch(_){q=[]}}q=Array.isArray(q)?q.map(String):[];for(const n of order)if(q.includes(n))return pages[n];return null}document.getElementById('login').onsubmit=async e=>{e.preventDefault();submit.disabled=true;m.textContent='Checking credentials…';try{const d=await Admin.login(u.value.trim(),p.value);const pd=await Admin.request({action:'myPermissions',token:d.token});const user=pd&&pd.user?pd.user:(d.user||{});sessionStorage.setItem('pmt-admin-user',JSON.stringify(user));const target=landing(user);if(!target)throw Error('No admin modules are assigned to this account. Ask the owner to assign access.');location.replace(target)}catch(err){m.textContent=err.message||'Login failed';submit.disabled=false}};
</script></body></html>
