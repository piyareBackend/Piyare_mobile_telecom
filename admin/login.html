<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PMT Admin Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body admin-login-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>PMT Admin Control Room</h2><p style="margin:8px 0 18px;color:var(--gray)">Credentials are verified on the server, followed by a one-time verification code.</p><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><div style="display:flex;gap:8px;align-items:center"><input id="p" type="password" autocomplete="current-password" minlength="10" required style="flex:1"><label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.8rem;color:var(--gray)"><input id="show" type="checkbox" style="width:auto"> Show</label></div></div><button id="submit" class="btn btn-blue btn-full" style="margin-top:16px">Sign in</button><p id="m" role="status" aria-live="polite" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">No password or OTP is embedded in the website. OTP delivery must be configured server-side.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
const u=document.getElementById('u'),p=document.getElementById('p'),show=document.getElementById('show'),submit=document.getElementById('submit'),m=document.getElementById('m');show.onchange=()=>p.type=show.checked?'text':'password';
const defaults={Support:['dashboard','pos','billing','orders_view','repairs','customers','inventory_view'],Editor:['dashboard','website','banners','products_view','products_edit','media','feedback'],Manager:['dashboard','pos','billing','products_view','products_edit','inventory_view','inventory_edit','orders_view','orders_edit','repairs','coupons','customers','feedback','analytics','reports','media','website','banners'],Owner:['*']};
const pages={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',products_edit:'product-editor-v2.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};
function perms(x){if(!x)return[];if(String(x.role)==='Owner')return['*'];let q=x.permissions;if(typeof q==='string'){try{q=JSON.parse(q)}catch(_){q=[]}}return Array.isArray(q)&&q.length?q:(defaults[String(x.role)]||[])}function landing(x){const q=perms(x);for(const k of Object.keys(pages))if(q.includes('*')||q.includes(k))return pages[k];return 'dashboard.html'}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();submit.disabled=true;m.textContent='Checking credentials…';try{const d=await Admin.login(u.value.trim(),p.value);const pd=await Admin.request({action:'myPermissions',token:d.token});const user=pd&&pd.user?pd.user:(d.user||{});sessionStorage.setItem('pmt-admin-user',JSON.stringify(user));location.replace(landing(user));}catch(err){m.textContent=err.message||'Login failed';submit.disabled=false}};
</script></body></html>
