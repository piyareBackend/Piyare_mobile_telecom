<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login — Piyare Mobile Telecom</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/site-polish.css"><style>.auth-wrap{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 18px}.auth-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.auth-card form{display:grid;gap:12px}.auth-card input{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.auth-msg{min-height:24px;color:var(--gray)}</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark"><img src="assets/logo.png" alt="Piyare Mobile Telecom" width="40" height="40"></span> Piyare Mobile Telecom</a><div class="navlinks"><a href="shop.html">Shop</a><a href="repair.html">Repair</a><a href="contact.html">Contact</a></div></nav></header><main class="auth-wrap"><section class="auth-card"><div class="section-tag">Customer account</div><h1>Welcome back</h1><p class="muted">Sign in to view your orders and repairs.</p><form id="form"><input id="email" type="email" autocomplete="email" required placeholder="Email"><input id="password" type="password" autocomplete="current-password" minlength="10" required placeholder="Password"><button class="btn btn-primary" type="submit">Sign in</button></form><p id="msg" class="auth-msg" role="status"></p><p><a href="forgot-password.html">Forgot password?</a></p><p>New customer? <a href="signup.html">Create an account</a></p></section></main><script src="assets/js/customer-account.js"></script><script>const f=document.getElementById('form'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='Signing in…';try{await PMTCustomer.login(document.getElementById('email').value,document.getElementById('password').value);const r=new URLSearchParams(location.search).get('return');location.replace(r||'account.html')}catch(x){m.textContent=x.message}};</script></body></html>
