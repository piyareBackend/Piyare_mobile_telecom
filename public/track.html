<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track — Piyare Mobile Telecom</title><meta name="description" content="Track your Piyare Mobile Telecom order or repair."><link rel="canonical" href="https://piyare-mobile-telecom.sadab-notes-backup.workers.dev/track.html"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/site-polish.css"><style>.track-loading{display:grid;gap:12px}.track-skeleton{height:18px;border-radius:9px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:pmtTrackShimmer 1.1s linear infinite}.track-skeleton.wide{height:80px;width:100%}@keyframes pmtTrackShimmer{to{background-position:-200% 0}}</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark">📱</span> Piyare Mobile Telecom</a><div class="navlinks"><a href="repair.html">Repair</a><a href="shop.html">Shop</a><a href="coupons.html">Coupons</a><a href="track.html" class="active">Track</a><a href="contact.html">Contact</a></div></nav></header><section class="page-hero"><div class="wrap hero-center"><div class="section-tag">Tracking</div><h1>Track your order or repair</h1><p>Use the secure order link from checkout, or enter a repair ticket ID.</p></div></section><section><div class="wrap"><form class="form-card" id="trackForm"><div class="field"><label for="ticketId">Repair Ticket ID</label><input id="ticketId" maxlength="40" autocomplete="off" placeholder="PMT-2026-0001"></div><button class="btn btn-blue" id="trackSubmit" type="submit">Track Repair</button></form><div id="trackResult" style="margin-top:20px" aria-live="polite"></div></div></section><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/security.js"></script><script src="assets/js/analytics.js"></script><script src="assets/js/cms.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search),order=q.get('order'),token=q.get('token');if(order&&token){location.replace('order-confirmation.html?order='+encodeURIComponent(order)+'&token='+encodeURIComponent(token));return}const form=document.getElementById('trackForm'),input=document.getElementById('ticketId'),result=document.getElementById('trackResult'),button=document.getElementById('trackSubmit');form.addEventListener('submit',async e=>{e.preventDefault();const id=input.value.trim();if(!id){result.innerHTML='<div class="panel">Enter your repair ticket ID.</div>';return}button.disabled=true;button.textContent='Checking…';result.innerHTML='<div class="panel track-loading" role="status"><div class="track-skeleton wide"></div><div class="track-skeleton" style="width:55%"></div></div>';try{const d=await pmtGet('track',{ticket:id});result.innerHTML='<div class="panel"><h3>Ticket '+escapeHtml(id)+'</h3><p>Status: <span class="badge">'+escapeHtml(String(d.status||'Not available'))+'</span></p></div>'}catch(err){result.innerHTML='<div class="panel"><h3>We could not load this ticket</h3><p>Please check the ticket ID and try again.</p></div>'}finally{button.disabled=false;button.textContent='Track Repair'}})});</script><footer><div class="wrap"><div class="foot-bottom">© 2026 Piyare Mobile Telecom. All rights reserved.</div></div></footer></body></html>
