<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Control Room Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body admin-login-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>Owner Control Room</h2><p style="margin:8px 0 18px;color:var(--gray)">Server-side credentials plus one-time verification are required.</p><input id="api" type="hidden"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><div style="display:flex;gap:8px;align-items:center"><input id="p" type="password" autocomplete="current-password" minlength="10" required style="flex:1"><label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.8rem;color:var(--gray);cursor:pointer"><input id="show" type="checkbox" style="width:auto"> Show password</label></div></div><button id="submit" class="btn btn-blue btn-full" style="margin-top:16px">Sign in</button><p id="m" role="status" aria-live="polite" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Credentials and OTP are verified only by the server. No password or OTP is stored in website code.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
const api=document.getElementById("api"),u=document.getElementById("u"),p=document.getElementById("p"),show=document.getElementById("show"),m=document.getElementById("m"),submit=document.getElementById("submit");
api.value=window.PMT_PUBLIC_API_URL||localStorage.getItem("pmt-api-url")||"";show.onchange=()=>p.type=show.checked?"text":"password";
const ROLE_DEFAULTS={Support:['dashboard','pos','billing','orders_view','repairs','customers','inventory_view'],Editor:['dashboard','website','banners','products_view','products_edit','media','feedback'],Manager:['dashboard','pos','billing','products_view','products_edit','inventory_view','inventory_edit','orders_view','orders_edit','repairs','coupons','customers','feedback','analytics','reports','media','website','banners'],Owner:['*']};
const LANDING={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};
function permissions(user){if(!user)return [];if(String(user.role)==='Owner')return ['*'];let x=user.permissions;if(typeof x==='string'){try{x=JSON.parse(x)}catch(_){x=[]}}return Array.isArray(x)&&x.length?x:(ROLE_DEFAULTS[String(user.role)]||[])}
function landing(user){const q=permissions(user);for(const n of Object.keys(LANDING)){if(q.includes('*')||q.includes(n))return LANDING[n]}return 'dashboard.html'}
async function verifyOtp(challengeId){return new Promise((resolve,reject)=>{const form=document.getElementById('login');form.querySelectorAll('.field,#show,.btn').forEach(x=>x.style.display='none');const box=document.createElement('div');box.id='otp-box';box.innerHTML='<div class="field"><label for="otp">6-digit verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div><button class="btn btn-blue btn-full" id="otp-submit" type="submit" style="margin-top:16px">Verify code</button><button class="btn btn-full" id="otp-back" type="button" style="margin-top:8px">Back</button><p id="otp-msg" role="status" aria-live="polite" style="margin-top:12px"></p>';form.insertBefore(box,submit);const otp=document.getElementById('otp'),msg=document.getElementById('otp-msg');otp.focus();form.onsubmit=async e=>{e.preventDefault();const v=otp.value.replace(/\D/g,'');if(v.length!==6){msg.textContent='Enter all 6 digits.';return}document.getElementById('otp-submit').disabled=true;msg.textContent='Verifying…';try{const d=await Admin.request({action:'adminStepUpVerify',challengeId,otp:v});if(!d||!d.token)throw Error(d&&d.message||'Verification failed');resolve(d)}catch(err){msg.textContent=err.message||'Verification failed';document.getElementById('otp-submit').disabled=false}};document.getElementById('otp-back').onclick=()=>{box.remove();form.querySelectorAll('.field,#show,.btn').forEach(x=>x.style.display='');form.onsubmit=loginSubmit};});}
let loginSubmit;
loginSubmit=async e=>{e.preventDefault();submit.disabled=true;m.textContent='Checking credentials…';if(!api.value){m.textContent='Shop API is not configured.';submit.disabled=false;return}try{const d=await Admin.request({action:'adminLogin',username:u.value.trim(),password:p.value});if(!d||!d.otpRequired)throw Error(d&&d.message||'Login failed');m.textContent='Verification code sent. Enter it below.';const v=await verifyOtp(d.challengeId);sessionStorage.setItem('pmt-admin-token',v.token);sessionStorage.setItem('pmt-admin-user',JSON.stringify(v.user||{}));location.replace(landing(v.user||{}));}catch(x){m.textContent=x.message||'Login failed';submit.disabled=false}};
document.getElementById('login').onsubmit=loginSubmit;
</script></body></html>
