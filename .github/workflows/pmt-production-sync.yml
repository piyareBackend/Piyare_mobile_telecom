name: PMT Production Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --no-update-check

      - name: Verify production HTML
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://piyare-mobile-telecom.sadab-notes-backup.workers.dev/shop.html | grep -q "pmtShopToolbar"
          curl --fail --silent --show-error --location --max-time 30 https://piyare-mobile-telecom.sadab-notes-backup.workers.dev/assets/js/site-enhancer.js | grep -q "pmt-polished"
