<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Footer — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><div class="admin-nav"><b>📱 PMT Admin</b><a href="dashboard.html">Dashboard</a><a href="editor.html">Page Editor</a><a href="seo.html">SEO Manager</a><a href="social.html">Social Footer</a><a href="settings.html">Settings</a><a href="#" id="logout">Logout</a></div><main class="admin-wrap"><h1>Social Footer</h1><p style="color:var(--gray)">Turn footer social links on/off and publish the exact profile URLs. Only enabled links are rendered publicly and included in local-business structured data when verified.</p><div id="msg"></div><section class="cms-section"><div id="socialRows"></div><button class="btn btn-primary" id="save">Publish Social Settings</button></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script>const defs=[['justdial','Justdial','https://www.justdial.com/Katihar/Piyare-Mobile-Telecom-Dwashay/9999P6452-6452-250401125010-W1X1_BZDET'],['google','Google','https://share.google/IO7bQ08OS90EUv95h'],['instagram','Instagram',''],['youtube','YouTube',''],['facebook','Facebook',''],['pinterest','Pinterest','https://in.pinterest.com/piyaremobiletelecom/']];let content;const rows=document.getElementById('socialRows');function esc(s){return escapeHtml(String(s||''))}function render(){const s=content.footer?.socials||{};rows.innerHTML=defs.map(d=>{const x=s[d[0]]||{};return '<div class="repeat-row" style="margin-bottom:12px"><div class="form-row"><div class="field"><label>'+d[1]+' URL</label><input data-url="'+d[0]+'" type="url" value="'+esc(x.url||d[2])+'" placeholder="https://..."></div><div class="field"><label>Visibility</label><select data-enabled="'+d[0]+'"><option value="true" '+((x.enabled!==false)?'selected':'')+'>ON</option><option value="false" '+((x.enabled===false)?'selected':'')+'>OFF</option></select></div></div></div>'}).join('')}async function start(){content=await pmtLoadFreshContent();content.footer=content.footer||{};render()}document.getElementById('save').onclick=async()=>{try{const socials={};defs.forEach(d=>{socials[d[0]]={label:d[1],url:document.querySelector('[data-url="'+d[0]+'"]').value.trim(),enabled:document.querySelector('[data-enabled="'+d[0]+'"]').value==='true'}});content.footer=content.footer||{};content.footer.socials=socials;const r=await pmtPost({action:'saveContent',content});if(!r.ok)throw Error(r.message||'Save failed');localStorage.setItem('pmt-content',JSON.stringify(content));localStorage.setItem('pmt-content-cache-v3',JSON.stringify({ts:Date.now(),content}));PMT_CONTENT_DATA=content;window.dispatchEvent(new CustomEvent('pmt-content-updated'));document.getElementById('msg').innerHTML='<div class="panel" style="margin:14px 0">Social footer settings published.</div>'}catch(e){document.getElementById('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message)+'</div>'}};document.getElementById('logout').onclick=e=>{e.preventDefault();Admin.logout()};start().catch(e=>document.getElementById('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message)+'</div>');</script></body></html>
