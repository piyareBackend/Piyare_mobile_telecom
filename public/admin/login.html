<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/admin/manifest.webmanifest"><title>PMT Admin Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>PMT Admin Login</h2><p style="margin:8px 0 18px;color:var(--gray)">Server-side credentials plus one-time verification are required.</p><input id="api" type="hidden" value="/api"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" minlength="10" required style="width:100%;box-sizing:border-box"></div><button type="submit" class="btn btn-blue btn-full" style="margin-top:16px" id="submit">Sign in</button><p id="m" role="status" aria-live="polite" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Access is controlled server-side. OTPs are never returned by the API.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
(function(){
  const ORDER=['dashboard','pos','billing','orders_view','repairs','customers','inventory_view','products_view','products_edit','website','banners','coupons','feedback','analytics','reports','media','settings','security','staff','backups'];
  const PAGE={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',products_edit:'product-editor-v2.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};
  function perms(user){if(!user)return [];if(String(user.role)==='Owner')return ['*'];let x=user.permissions;if(typeof x==='string'){try{x=JSON.parse(x)}catch(_){x=[]}}return Array.isArray(x)?x.map(String):[]}
  function landing(user){const p=perms(user);for(const n of ORDER)if(p.includes('*')||p.includes(n))return PAGE[n];return null}
  async function verify(challengeId){return new Promise((resolve,reject)=>{const form=document.getElementById('login'),fields=form.querySelectorAll('.field');fields.forEach(x=>x.style.display='none');const box=document.createElement('div');box.id='otp-box';box.innerHTML='<div class="field" style="display:block"><label for="otp">6-digit verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div><button class="btn btn-blue btn-full" type="submit" style="margin-top:16px">Verify code</button><p id="otp-msg" role="status" aria-live="polite" style="margin-top:12px"></p>';form.appendChild(box);const otp=document.getElementById('otp'),msg=document.getElementById('otp-msg');otp.focus();form.onsubmit=async e=>{e.preventDefault();const v=otp.value.replace(/\D/g,'');if(v.length!==6){msg.textContent='Enter all 6 digits.';return}msg.textContent='Verifying…';try{const d=await Admin.request({action:'adminStepUpVerify',challengeId,otp:v});if(!d||!d.token)throw Error(d&&d.message||'Verification failed');resolve(d)}catch(err){msg.textContent=err.message||'Verification failed'}};});}
  let loginSubmit;loginSubmit=async function(e){e.preventDefault();m.textContent='Checking credentials…';submit.disabled=true;try{const d=await Admin.request({action:'adminLogin',username:u.value.trim(),password:p.value});if(!d||!d.otpRequired)throw Error(d&&d.message||'Login failed');m.textContent='Verification code sent.';const v=await verify(d.challengeId);sessionStorage.setItem('pmt-admin-token',v.token);sessionStorage.setItem('pmt-admin-user',JSON.stringify(v.user||{}));const target=landing(v.user||{});if(!target)throw Error('No admin modules are assigned to this account. Ask the owner to assign access.');location.replace(target)}catch(x){m.textContent=x.message||'Login failed';submit.disabled=false}};
  document.getElementById('login').onsubmit=loginSubmit;
})();
</script></body></html>
