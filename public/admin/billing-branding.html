<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Billing Branding</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Billing Branding</b><div><a class="btn" href="billing.html">Back to Billing</a></div></header><main class="admin-main"><section class="cms-section"><h1>Invoice & Receipt Branding</h1><p>Configure the information shown on A4, 80mm and 58mm bills. Settings are stored locally in this browser.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><label class="field">Shop / Business name<input id="shopName"></label><label class="field">Phone<input id="phone"></label><label class="field" style="grid-column:1/-1">Address<input id="address"></label><label class="field">GSTIN<input id="gstin"></label><label class="field">Email<input id="email"></label><label class="field">UPI ID<input id="upiId" placeholder="example@upi"></label><label class="field">Bank name<input id="bankName"></label><label class="field">Account name<input id="accountName"></label><label class="field">Account number<input id="accountNumber"></label><label class="field">IFSC<input id="ifsc"></label><label class="field">Logo image URL<input id="logoUrl" placeholder="Blank = PMT logo"></label><label class="field">Signature image URL<input id="signatureUrl" placeholder="Optional"></label><label class="field">Signature label<input id="signatureLabel"></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-blue" id="save">Save branding</button><button class="btn" id="reset">Reset</button></div><p id="status"></p></section></main><script src="../assets/js/security.js"></script><script>
(function(){'use strict';const KEY='pmt-billing-branding-v1';const D={shopName:'Piyare Mobile Telecom',address:'',gstin:'',phone:'',email:'',upiId:'',bankName:'',accountName:'',accountNumber:'',ifsc:'',logoUrl:'',signatureLabel:'Authorized Signatory',signatureUrl:''};const $=id=>document.getElementById(id);let v=D;try{v=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(_){}Object.keys(D).forEach(k=>{$(k).value=v[k]??''});save.onclick=function(){const out={};Object.keys(D).forEach(k=>out[k]=$(k).value.trim());out.shopName=out.shopName||D.shopName;out.signatureLabel=out.signatureLabel||D.signatureLabel;localStorage.setItem(KEY,JSON.stringify(out));status.textContent='Saved. New bills will use these settings.'};reset.onclick=function(){localStorage.removeItem(KEY);location.reload()};})();
</script></body></html>
