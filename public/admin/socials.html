<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Social Links — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="dashboard.html">Dashboard</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="socials.html">Social Links</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="feedback.html">Feedback</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Footer Social Links</h1><p>Only configured official profile/listing URLs are shown publicly.</p><div id="msg"></div><section class="cms-section"><div id="socialEditor"></div></section><div style="margin-top:18px"><button class="btn btn-blue" id="save">Save & Publish</button></div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script>(async()=>{const defs={justdial:['Justdial','https://www.justdial.com/Katihar/Piyare-Mobile-Telecom-Dwashay/9999P6452-6452-250401125010-W1X1_BZDET'],google:['Google Business / Share','https://share.google/IO7bQ08OS90EUv95h'],instagram:['Instagram',''],youtube:['YouTube',''],facebook:['Facebook',''],pinterest:['Pinterest','https://in.pinterest.com/piyaremobiletelecom/']};let content=await loadSiteContent();content.footer=content.footer||{};content.footer.socials=content.footer.socials||{};function esc(v){return escapeHtml(String(v??''))}socialEditor.innerHTML=Object.entries(defs).map(([k,d])=>{const x=content.footer.socials[k]||{};const url=String(x.url||d[1]);return `<div class="repeat-row"><div class="form-row"><div class="field"><label>${d[0]} URL</label><input type="url" data-url="${k}" value="${esc(url)}" placeholder="https://..."></div><label style="display:flex;align-items:center;gap:8px;margin-top:28px"><input type="checkbox" data-enabled="${k}" ${x.enabled!==false&&url?'checked':''}> Show in footer</label></div></div>`}).join('');save.onclick=async()=>{save.disabled=true;try{content.footer.socials={};Object.keys(defs).forEach(k=>{const url=document.querySelector(`[data-url="${k}"]`).value.trim();content.footer.socials[k]={label:defs[k][0],url,enabled:document.querySelector(`[data-enabled="${k}"]`).checked&&!!url};});const d=await pmtPost({action:'saveContent',content});if(!d?.ok)throw Error(d?.message||'Publish failed');localStorage.setItem('pmt-content',JSON.stringify(content));msg.innerHTML='<div class="panel">Social links published successfully.</div>';}catch(e){msg.innerHTML='<div class="panel" style="color:var(--red)">'+esc(e.message||'Publish failed')+'</div>'}finally{save.disabled=false}}})().catch(e=>msg.textContent=e.message||'Could not load settings');</script></body></html>
