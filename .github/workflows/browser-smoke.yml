name: PMT Browser Smoke
on:
  push:
    branches: ['main','security/zero-trust-admin-otp']
  pull_request:
    paths: ['public/**','assets/**','worker.js','wrangler.jsonc','.github/workflows/browser-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test deployed site
        env:
          PMT_BASE_URL: https://piyare-mobile-telecom.sadab-notes-backup.workers.dev
        run: |
          set -euo pipefail
          cat > pmt-browser-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = process.env.PMT_BASE_URL.replace(/\/$/, '');
          const origin = new URL(base).origin;
          const pages = ['/', '/shop.html', '/product.html', '/checkout.html', '/order-confirmation.html', '/track.html', '/account.html', '/login.html', '/signup.html', '/forgot-password.html', '/reset-password.html', '/admin/login.html', '/admin/billing.html'];
          const browser = await chromium.launch({headless:true});
          let failures = 0;
          for (const mobile of [false,true]) {
            const context = await browser.newContext({viewport: mobile ? {width:390,height:844}:{width:1440,height:900}, isMobile: mobile});
            const page = await context.newPage();
            const pageErrors=[];
            page.on('pageerror', e => pageErrors.push(e.message));
            for (const path of pages) {
              try {
                pageErrors.length=0;
                const r=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:30000});
                if(!r||!r.ok())throw Error(`HTTP ${r?.status()??'none'}`);
                if(new URL(page.url()).origin!==origin)throw Error(`Unexpected redirect: ${page.url()}`);
                await page.waitForTimeout(350);
                if(!(await page.locator('body').innerText()).trim())throw Error('Blank body');
                if(pageErrors.length)throw Error(`Page errors: ${pageErrors.join(' | ')}`);
                if(path==='/admin/login.html'&&!(await page.locator('#login').count()))throw Error('Admin login form missing');
                console.log('PASS', mobile?'mobile':'desktop', path);
              }catch(e){failures++;console.error('FAIL',mobile?'mobile':'desktop',path,e.message);await page.screenshot({path:`failure-${mobile?'mobile':'desktop'}-${path.replaceAll('/','_')}.png`,fullPage:true}).catch(()=>{});}
            }
            await context.close();
          }
          const anonCases=[['GET',`${base}/api?action=orders`,null],['GET',`${base}/api?action=customers`,null],['POST',`${base}/api`,JSON.stringify({action:'dashboard'})]];
          for(const [method,url,body] of anonCases){try{const r=await fetch(url,{method,headers:{'Content-Type':'text/plain','Accept':'application/json'},body});const d=await r.json();if(d?.ok===true)throw Error('Protected admin API returned success without a session');if(method==='POST'&&!['AUTH_REQUIRED','PERMISSION_DENIED','UNAUTHORIZED'].includes(String(d?.code||'').toUpperCase()))throw Error(`Unexpected auth response code: ${d?.code||'none'}`);console.log('PASS anonymous API guard',method,url)}catch(e){failures++;console.error('FAIL anonymous API guard',method,url,e.message)}}
          const h=await fetch(base+'/health',{cache:'no-store'});const hd=await h.json().catch(()=>({}));if(!h.ok||hd.ok!==true){failures++;console.error('FAIL health',h.status,JSON.stringify(hd));}else console.log('PASS health',JSON.stringify(hd));
          await browser.close();
          if(failures)process.exit(1);
          EOF
          node pmt-browser-smoke.mjs
