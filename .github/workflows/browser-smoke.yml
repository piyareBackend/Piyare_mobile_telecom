name: PMT Browser Smoke
on:
  push:
    branches: ['security/zero-trust-admin-otp']
  pull_request:
    paths:
      - 'public/**'
      - 'assets/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Browser smoke test deployed site
        env:
          PMT_BASE_URL: https://piyare-mobile-telecom.sadab-notes-backup.workers.dev
        run: |
          cat > /tmp/pmt-browser-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = process.env.PMT_BASE_URL.replace(/\/$/, '');
          const pages = ['/', '/shop.html', '/product.html', '/checkout.html', '/order-confirmation.html', '/track.html', '/account.html', '/login.html', '/signup.html', '/admin/login.html'];
          const browser = await chromium.launch({headless:true});
          const contexts = [
            await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1}),
            await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true})
          ];
          let failures = 0;
          for (const context of contexts) {
            const page = await context.newPage();
            page.on('pageerror', e => { console.error('PAGEERROR', page.url(), e.message); failures++; });
            for (const path of pages) {
              try {
                const response = await page.goto(base + path, {waitUntil:'domcontentloaded', timeout:30000});
                if (!response || !response.ok()) throw new Error(`HTTP ${response?.status() ?? 'none'}`);
                const origin = new URL(page.url()).origin;
                if (origin !== new URL(base).origin) throw new Error(`Unexpected redirect to ${page.url()}`);
                await page.waitForTimeout(250);
                const bodyText = await page.locator('body').innerText();
                if (!bodyText.trim()) throw new Error('Blank body');
                console.log('PASS', context.viewportSize(), path, page.url());
                if (path === '/' && context.viewportSize().width <= 500) {
                  const menu = page.locator('.site-mobile-menu');
                  if (await menu.count()) {
                    await menu.click();
                    await page.waitForTimeout(100);
                    const opened = await page.locator('.site-menu-overlay.open').count();
                    if (!opened) throw new Error('Mobile navigation did not open');
                    await page.locator('.site-menu-overlay.open').click({position:{x:3,y:3}});
                  }
                }
              } catch (e) {
                failures++;
                console.error('FAIL', context.viewportSize(), path, e.message);
                await page.screenshot({path:`/tmp/failure-${context.viewportSize().width}-${path.replaceAll('/','_')}.png`, fullPage:true}).catch(()=>{});
              }
            }
            await context.close();
          }
          await browser.close();
          if (failures) process.exit(1);
          EOF
          node /tmp/pmt-browser-smoke.mjs
