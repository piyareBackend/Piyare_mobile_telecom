name: PMT Browser Smoke
on:
  push:
    branches: ['main','security/zero-trust-admin-otp']
  pull_request:
    paths:
      - 'public/**'
      - 'assets/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['PMT Production Sync']
    types: [completed]

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        working-directory: /tmp/pmt-browser
        run: |
          mkdir -p /tmp/pmt-browser
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test deployed site
        working-directory: /tmp/pmt-browser
        env:
          PMT_BASE_URL: https://piyare-mobile-telecom.sadab-notes-backup.workers.dev
        run: |
          cat > pmt-browser-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = process.env.PMT_BASE_URL.replace(/\/$/, '');
          const pages = ['/', '/shop.html', '/product.html', '/checkout.html', '/order-confirmation.html', '/track.html', '/account.html', '/login.html', '/signup.html', '/forgot-password.html', '/reset-password.html', '/admin/login.html', '/admin/billing.html'];
          const browser = await chromium.launch({headless:true});
          const contexts = [
            await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1}),
            await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true})
          ];
          let failures = 0;
          for (const context of contexts) {
            const page = await context.newPage();
            const pageErrors=[];
            page.on('pageerror', e => pageErrors.push(e.message));
            for (const path of pages) {
              try {
                pageErrors.length=0;
                const response = await page.goto(base + path, {waitUntil:'domcontentloaded', timeout:30000});
                if (!response || !response.ok()) throw new Error(`HTTP ${response?.status() ?? 'none'}`);
                const current = new URL(page.url());
                if (current.origin !== new URL(base).origin) throw new Error(`Unexpected redirect to ${page.url()}`);
                await page.waitForTimeout(350);
                const bodyText = await page.locator('body').innerText();
                if (!bodyText.trim()) throw new Error('Blank body');
                if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
                if (path === '/admin/login.html' && !(await page.locator('#login').count())) throw new Error('Admin login form missing');
                if (path === '/admin/billing.html' && !(await page.locator('body').innerText()).match(/billing|login|control room/i)) throw new Error('Admin billing shell missing expected content');
                if (path === '/' && context.viewportSize().width <= 500) {
                  const menu = page.locator('.site-mobile-menu');
                  if (await menu.count()) {
                    await menu.click();
                    await page.waitForTimeout(100);
                    if (!(await page.locator('.site-menu-overlay.open').count())) throw new Error('Mobile navigation did not open');
                    await page.locator('.site-menu-overlay.open').click({position:{x:3,y:3}}).catch(()=>{});
                  }
                }
                console.log('PASS', context.viewportSize(), path, page.url());
              } catch (e) {
                failures++;
                console.error('FAIL', context.viewportSize(), path, e.message);
                await page.screenshot({path:`failure-${context.viewportSize().width}-${path.replaceAll('/','_')}.png`, fullPage:true}).catch(()=>{});
              }
            }
            await context.close();
          }
          await browser.close();
          if (failures) process.exit(1);
          EOF
          node pmt-browser-smoke.mjs
