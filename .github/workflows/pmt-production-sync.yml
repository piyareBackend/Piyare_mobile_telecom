name: PMT Production Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }

      - name: Static architecture smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -e public/assets/js/commerce-fixes.js; echo "obsolete commerce cart file absent"
          test ! -e public/assets/js/product-fixes.js; echo "obsolete product override file absent"
          ! grep -q 'assets/js/commerce-fixes.js' public/*.html; echo "no commerce override references"
          ! grep -q 'assets/js/product-fixes.js' public/*.html; echo "no product override references"
          ! grep -q 'class="page-hero"' public/shop.html; echo "shop hero removed"
          grep -q 'pmtResponse(response)' public/checkout.html; echo "checkout parses backend response"
          grep -q 'result?.ok!==true' public/checkout.html; echo "checkout requires successful order"
          grep -q 'order-confirmation.html' public/checkout.html; echo "checkout confirmation route wired"
          grep -q 'pmt-order-confirmation' public/checkout.html; echo "checkout confirmation state wired"
          grep -q 'order_success' public/order-confirmation.html; echo "order success analytics wired"
          grep -q 'getElementById' public/track.html; echo "tracking uses explicit DOM refs"
          grep -q 'getUserMedia' public/assets/js/barcode-camera.js; echo "barcode camera present"
          grep -q "CACHE='pmt-admin-shell-v10'" public/admin/sw.js; echo "PWA cache version current"
          grep -q 'PMTBilling.complete' public/admin/billing.html; echo "unified billing transaction wired"
          grep -q 'PMTBilling.snapshot' public/admin/billing.html; echo "unified billing calculator wired"
          grep -q 'createPosBill' public/assets/js/unified-billing-engine.js; echo "unified billing backend flow wired"
          grep -q 'BILLING_URL' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java; echo "APK canonical billing URL present"
          grep -q 'setSafeBrowsingEnabled(true)' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java; echo "APK Safe Browsing enabled"
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java; echo "APK mixed content blocked"
          grep -q 'setWebContentsDebuggingEnabled((getApplicationInfo().flags&ApplicationInfo.FLAG_DEBUGGABLE)!=0)' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java; echo "APK release WebView debugging disabled"
          grep -q 'openBilling' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/HomeActivity.java; echo "APK Home billing shortcut present"
          grep -q 'android:usesCleartextTraffic="false"' sms-bridge/app/src/main/AndroidManifest.xml; echo "APK cleartext traffic disabled"
          grep -q "location.replace('/admin/billing.html'+location.search+location.hash)" public/admin/pos.html; echo "legacy POS delegates to canonical Billing"
          ! grep -Eq 'function (addToCart|renderCart|calculateTotal|createOrder)|\b(let|var|const) cart\b|window\.cart|createPosBill' public/admin/pos.html; echo "no independent POS billing implementation"
          ! grep -Eq 'function (addToCart|renderCart|calculateTotal|createOrder)' public/admin/billing.html; echo "no duplicate billing function names"
          ! grep -Eq '\b(let|var) cart\b|window\.cart' public/admin/billing.html; echo "no second global cart state"
          ! grep -qi 'couponInput' public/admin/billing.html; echo "coupon UI not faked in Unified Billing"
          grep -q 'CustomerIdentities' backend/ZZZZZZZZZ_CustomerAccounts.gs; echo "customer identity schema present"
          grep -q 'customer_id' backend/ZZZZZZZZZ_CustomerAccounts.gs; echo "canonical customer_id linkage present"
          grep -q 'CustomerSessions' backend/ZZZZZZZZZZ_CustomerSessionStore.gs; echo "durable customer session store present"
          grep -q 'customer_token' public/assets/js/customer-account.js; echo "customer token transport present"
          grep -q 'customer_token:customerToken' public/assets/js/app.js; echo "authenticated checkout/repair transport wired"
          test -f public/account.html && test -f public/login.html && test -f public/signup.html && test -f public/forgot-password.html && test -f public/reset-password.html; echo "customer account pages present"
          for file in public/assets/js/app.js public/assets/js/cart.js public/assets/js/config.js public/assets/js/analytics.js public/assets/js/barcode-camera.js public/assets/js/billing-print.js public/assets/js/unified-billing-engine.js public/assets/js/customer-account.js backend/*.gs; do node --check "$file"; echo "syntax ok: $file"; done
          echo "Static architecture smoke tests passed"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p sms-bridge assembleDebug --no-daemon --stacktrace
          test -s sms-bridge/app/build/outputs/apk/debug/app-debug.apk
          echo "APK debug build passed: sms-bridge/app/build/outputs/apk/debug/app-debug.apk"
          gradle -p sms-bridge assembleRelease --no-daemon --stacktrace
          test -n "$(find sms-bridge/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          echo "APK release build passed"

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify production assets and critical flows
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://piyare-mobile-telecom.sadab-notes-backup.workers.dev'
          for page in / /shop.html /product.html /checkout.html /order-confirmation.html /contact.html /repair.html /track.html /coupons.html /account.html /login.html /signup.html /forgot-password.html /reset-password.html /admin/billing.html; do
            curl --fail --silent --show-error --location --max-time 30 "$BASE$page" >/tmp/pmt-page.html
            test -s /tmp/pmt-page.html
            echo "production page ok: $page"
          done
          curl --fail --silent --show-error --location --max-time 30 "$BASE/health" | grep -q '"ok":true'; echo "production health ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/admin/billing.html" | grep -q 'PMTBilling.complete'; echo "production unified billing wiring ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/assets/js/unified-billing-engine.js" | grep -q 'createPosBill'; echo "production billing engine ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/assets/js/billing-print.js" | grep -q 'window.print'; echo "production print invocation ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/admin/pos.html" | grep -q '/admin/billing.html'; echo "production POS compatibility route ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/shop.html" | grep -q "pmtShopToolbar"; echo "production shop structure ok"
          ! curl --fail --silent --show-error --location --max-time 30 "$BASE/shop.html" | grep -q 'page-hero'; echo "production shop hero absent"
          ! curl --fail --silent --show-error --location --max-time 30 "$BASE/product.html" | grep -q 'assets/js/product-fixes.js'; echo "production product override absent"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/checkout.html" | grep -q 'order-confirmation.html'; echo "production checkout confirmation wiring ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/track.html" | grep -q "getElementById"; echo "production tracking structure ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/admin/sw.js?v=10" | grep -q "pmt-admin-shell-v10"; echo "production PWA cache version ok"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/assets/js/customer-account.js" | grep -q 'PMTCustomer'; echo "production customer client asset ok"
          echo "Production asset smoke tests passed"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmt-apks
          path: |
            sms-bridge/app/build/outputs/apk/debug/app-debug.apk
            sms-bridge/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
