name: Zero Trust Admin Security Checks
on:
  push:
    branches: ['main','security/zero-trust-admin-otp']
  pull_request:
    paths: ['backend/**','admin/**','public/admin/**','assets/js/admin.js','public/assets/js/admin.js','assets/js/security.js','public/assets/js/security.js','sms-bridge/**','.github/workflows/zero-trust-security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/js/admin.js public/assets/js/admin.js assets/js/security.js public/assets/js/security.js; do node --check "$f"; done
          for f in backend/*.gs; do cp "$f" /tmp/pmt-security-syntax.js; node --check /tmp/pmt-security-syntax.js; done
      - name: Zero-trust source invariants
        shell: python
        run: |
          from pathlib import Path
          def read(p): return Path(p).read_text(encoding='utf-8')
          files={
            'public_login':read('public/admin/login.html'),
            'public_admin_js':read('public/assets/js/admin.js'),
            'bridge_main':read('sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/MainActivity.java'),
            'bridge_service':read('sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/SmsBridgeService.java'),
            'security':read('backend/ZeroTrustSecurity.gs'),'enforce':read('backend/ZZZZZZZZZZ_ZeroTrustEnforcement.gs'),
            'router':read('backend/ZZZZZZZZZZZZZZZZZZ_FinalRouter.gs'),'admin_activity':read('sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java'),
          }
          required={
            'public_login':['Admin.login(','id="login"'],
            'public_admin_js':['adminLoginOtpVerify','ensureStepUp','otpDialog'],
            'bridge_main':['adminBridgeLogin','adminBridgeOtpVerify'],'bridge_service':['adminBridgeRefresh'],
            'security':['ztCredentialLogin_','ztVerifyOtp_','AdminSessions','AdminAuditLog','STEP_UP_REQUIRED'],
            'enforce':['ztRefreshSession_','ZT_ADMIN_ACTIONS'],'router':['adminLoginOtpVerify','adminBridgeRefresh','adminBridgeOtpVerify'],
            'admin_activity':['setSafeBrowsingEnabled(true)','MIXED_CONTENT_NEVER_ALLOW']}
          for name,needles in required.items():
              for needle in needles:
                  if needle not in files[name]: raise SystemExit(f'missing invariant: {name}: {needle}')
          if 'action","adminLogin"' in files['bridge_main'] or 'action","adminLogin"' in files['bridge_service']:
              raise SystemExit('legacy immediate-token bridge login protocol remains')
          import re
          bad=re.compile(r'(?:MASTER.?OTP|UNIVERSAL.?OTP|123456)',re.I)
          roots=(Path('backend'),Path('public/admin'))
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix.lower() not in {'.gs','.js','.html'} or not p.is_file(): continue
                  text=p.read_text(encoding='utf-8',errors='ignore')
                  for n,line in enumerate(text.splitlines(),1):
                      if bad.search(line): raise SystemExit(f'forbidden OTP literal: {p}:{n}:{line.strip()}')
          print('Zero-trust source invariants passed')
      - name: Android manifest security check
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ns='http://schemas.android.com/apk/res/android'
          root=ET.parse('sms-bridge/app/src/main/AndroidManifest.xml').getroot();app=root.find('application')
          if app is None or app.get('{%s}usesCleartextTraffic' % ns)!='false': raise SystemExit('Android cleartext traffic must be explicitly disabled')
          if app.get('{%s}allowBackup' % ns)=='true': raise SystemExit('Android backup must not be enabled for the bridge')
          print('Android manifest security check passed')
      - name: Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p sms-bridge assembleDebug --no-daemon --stacktrace
          test -s sms-bridge/app/build/outputs/apk/debug/app-debug.apk
