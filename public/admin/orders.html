<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room — Orders</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="banners.html">Banners</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="reports.html">Monthly Reports</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Orders</h1><p>Customer → order → items → status in one page.</p><section class="cms-section"><div class="admin-actions"><button class="btn" id="refresh" type="button">↻ Refresh</button><a class="btn btn-blue" href="reports.html">Monthly report</a></div><div id="state" style="margin-top:10px;color:var(--gray)" role="status" aria-live="polite"></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Customer / ID</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>const STATUS=['Pending','Confirmed','Rejected','Processing','Shipped','Delivered','Cancelled','Completed'];const $=id=>document.getElementById(id);let loading=false;async function load(){if(loading)return;loading=true;$('refresh').disabled=true;$('state').textContent='Loading orders…';try{const d=await pmtGet('orders'),a=Array.isArray(d?.items)?d.items:[];$('rows').innerHTML=a.map(x=>{const items=(x.items||[]).map(i=>`${escapeHtml(i.name||i.id||'Product')}${i.variant?` — ${escapeHtml(i.variant)}`:''} × ${Number(i.qty||0)}`).join('<br>');const options=STATUS.map(s=>`<option value="${s}" ${s===x.status?'selected':''}>${s}</option>`).join('');return `<tr><td><a href="order-detail.html?id=${encodeURIComponent(x.id)}"><b>${escapeHtml(x.customer||'Customer')}</b></a><br><small>${escapeHtml(x.id)} · ${escapeHtml(x.date||'')}</small></td><td>${items||'—'}</td><td>₹${Number(x.total||0).toLocaleString('en-IN')}</td><td>${escapeHtml(x.payment||'—')}</td><td><select data-id="${escapeHtml(x.id)}" aria-label="Status for ${escapeHtml(x.id)}">${options}</select></td></tr>`}).join('')||'<tr><td colspan="5">No records yet.</td></tr>';$('state').textContent=a.length?`${a.length} order${a.length===1?'':'s'} loaded.`:'No orders yet.';rows.querySelectorAll('select').forEach(s=>s.onchange=()=>changeStatus(s));}catch(e){$('rows').innerHTML='<tr><td colspan="5">'+escapeHtml(e.message||'API request failed')+'</td></tr>';$('state').textContent='Could not load orders.'}finally{loading=false;$('refresh').disabled=false}}async function changeStatus(select){const id=select.dataset.id,previous=select.dataset.previous||select.value;select.disabled=true;$('state').textContent='Saving order status…';try{await pmtPost({action:'updateOrder',payload:{id,status:select.value}});pmtClearAdminCache();$('state').textContent='Order status saved.';select.dataset.previous=select.value;await load()}catch(e){select.value=previous;$('state').textContent=e.message||'Update failed';alert(e.message||'Update failed')}finally{select.disabled=false}}$('refresh').onclick=load;load();</script></body></html>
