name: PMT Production Sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: 22
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
      - name: Static architecture smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -d admin
          test ! -e public/assets/js/commerce-fixes.js
          test ! -e public/assets/js/product-fixes.js
          ! grep -q 'assets/js/commerce-fixes.js' public/*.html
          ! grep -q 'assets/js/product-fixes.js' public/*.html
          ! grep -q 'class="page-hero"' public/shop.html
          grep -q 'pmtResponse(response)' public/checkout.html
          grep -q 'result?.ok!==true' public/checkout.html
          grep -q 'order-confirmation.html' public/checkout.html
          grep -q 'pmt-order-confirmation' public/order-confirmation.html
          grep -q 'order_success' public/order-confirmation.html
          grep -q 'getElementById' public/track.html
          grep -q 'getUserMedia' public/assets/js/barcode-camera.js
          grep -q "CACHE='pmt-admin-shell-v11'" public/admin/sw.js
          grep -q 'PMTBilling.complete' public/admin/billing.html
          grep -q 'PMTBilling.snapshot' public/admin/billing.html
          grep -q 'createPosBill' public/assets/js/unified-billing-engine.js
          grep -q 'BILLING_URL' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
          grep -q 'setSafeBrowsingEnabled(true)' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
          grep -q 'setWebContentsDebuggingEnabled((getApplicationInfo().flags&ApplicationInfo.FLAG_DEBUGGABLE)!=0)' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
          grep -q 'openBilling' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/HomeActivity.java
          grep -q 'android:usesCleartextTraffic="false"' sms-bridge/app/src/main/AndroidManifest.xml
          grep -q "location.replace('/admin/billing.html'+location.search+location.hash)" public/admin/pos.html
          ! grep -Eq 'function (addToCart|renderCart|calculateTotal|createOrder)|\b(let|var|const) cart\b|window\.cart|createPosBill' public/admin/pos.html
          ! grep -Eq 'function (addToCart|renderCart|calculateTotal|createOrder)' public/admin/billing.html
          ! grep -Eq '\b(let|var) cart\b|window\.cart' public/admin/billing.html
          ! grep -qi 'couponInput' public/admin/billing.html
          grep -q 'CustomerIdentities' backend/ZZZZZZZZZ_CustomerAccounts.gs
          grep -q 'customer_id' backend/ZZZZZZZZZ_CustomerAccounts.gs
          grep -q 'CustomerSessions' backend/ZZZZZZZZZZ_CustomerSessionStore.gs
          grep -q 'customer_token' public/assets/js/customer-account.js
          grep -q 'customer_token:customerToken' public/assets/js/app.js
          test -f public/account.html && test -f public/login.html && test -f public/signup.html && test -f public/forgot-password.html && test -f public/reset-password.html
          for file in public/assets/js/app.js public/assets/js/cart.js public/assets/js/config.js public/assets/js/analytics.js public/assets/js/barcode-camera.js public/assets/js/billing-print.js public/assets/js/unified-billing-engine.js public/assets/js/customer-account.js backend/*.gs; do
            if [[ "$file" == *.gs ]]; then cp "$file" /tmp/pmt-syntax-check.js; node --check /tmp/pmt-syntax-check.js; else node --check "$file"; fi
          done
          echo "Static architecture smoke tests passed"
      - name: Remediation regression tests
        run: node tests/remediation-regression.js
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p sms-bridge assembleDebug --no-daemon --stacktrace
          test -s sms-bridge/app/build/outputs/apk/debug/app-debug.apk
          gradle -p sms-bridge assembleRelease --no-daemon --stacktrace
          test -n "$(find sms-bridge/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Deploy Apps Script backend when CI credentials are configured
        shell: bash
        env:
          HAS_CLASP: ${{ secrets.CLASPRC_JSON != '' && secrets.CLASP_JSON != '' }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        if: ${{ env.HAS_CLASP == 'true' }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          node -e "const c=require('./.clasp.json'); if(!c.rootDir || c.rootDir.replace(/\\\\/g,'/').replace(/^\\.\\//,'')!=='backend') throw new Error('CLASP_JSON must target rootDir=backend for this repository');"
          npx --yes @google/clasp push --force
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify production assets and critical flows
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://piyare-mobile-telecom.sadab-notes-backup.workers.dev'
          fetch_page() {
            local path="$1"
            curl --fail --silent --show-error --location --max-time 30 "$BASE$path" -o /tmp/pmt-check.html
            test -s /tmp/pmt-check.html
          }
          check_contains() {
            local path="$1" pattern="$2"
            fetch_page "$path"
            grep -q -- "$pattern" /tmp/pmt-check.html
          }
          check_absent() {
            local path="$1" pattern="$2"
            fetch_page "$path"
            ! grep -q -- "$pattern" /tmp/pmt-check.html
          }
          for page in / /shop.html /product.html /checkout.html /order-confirmation.html /contact.html /repair.html /track.html /coupons.html /account.html /login.html /signup.html /forgot-password.html /reset-password.html /admin/login.html /admin/billing.html; do
            fetch_page "$page"
          done
          check_contains /health '"ok":true'
          check_contains /admin/login.html 'Admin.login('
          check_contains /assets/js/admin.js 'adminLoginOtpVerify'
          check_contains /assets/js/unified-billing-engine.js 'createPosBill'
          check_contains /assets/js/billing-print.js 'window.print'
          check_contains /admin/pos.html '/admin/billing.html'
          check_contains /shop.html 'pmtShopToolbar'
          check_absent /shop.html 'page-hero'
          check_absent /product.html 'assets/js/product-fixes.js'
          check_contains /checkout.html 'order-confirmation.html'
          check_contains /track.html 'getElementById'
          check_contains /admin/sw.js 'pmt-admin-shell-v11'
          check_contains /assets/js/customer-account.js 'PMTCustomer'
          echo "Production asset smoke tests passed"
      - name: Verify source-to-production parity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://piyare-mobile-telecom.sadab-notes-backup.workers.dev'
          headers="$(curl --fail --silent --show-error --location --max-time 30 -D - -o /dev/null "$BASE/")"
          printf '%s\n' "$headers" | grep -qi '^x-pmt-worker-version: 7\.4-performance' || { echo 'Worker version header mismatch'; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:' || { echo 'CSP header missing'; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE/index.html" -o /tmp/pmt-live-index.html
          cmp -s public/index.html /tmp/pmt-live-index.html || { echo 'index.html parity mismatch'; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE/admin/sw.js" -o /tmp/pmt-live-sw.js
          cmp -s public/admin/sw.js /tmp/pmt-live-sw.js || { echo 'admin service worker parity mismatch'; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE/assets/js/customer-account.js" -o /tmp/pmt-live-customer.js
          cmp -s public/assets/js/customer-account.js /tmp/pmt-live-customer.js || { echo 'customer account asset parity mismatch'; exit 1; }
          status="$(curl --silent --show-error --location --max-time 30 -o /tmp/pmt-img.json -w '%{http_code}' "$BASE/img?src=https%3A%2F%2Fexample.com%2Fnot-an-image")"
          test "$status" = "403" || { echo "Unexpected /img disallowed-host status: $status"; cat /tmp/pmt-img.json; exit 1; }
          echo "Source-to-production parity and security-header checks passed"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmt-apks
          path: |
            sms-bridge/app/build/outputs/apk/debug/app-debug.apk
            sms-bridge/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
