name: Zero Trust Admin Security Checks
on:
  push:
    branches: ['main','security/zero-trust-admin-otp']
  pull_request:
    paths: ['backend/**','admin/**','public/admin/**','assets/js/admin.js','public/assets/js/admin.js','assets/js/security.js','public/assets/js/security.js','sms-bridge/**','.github/workflows/zero-trust-security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/js/admin.js public/assets/js/admin.js assets/js/security.js public/assets/js/security.js; do node --check "$f"; done
          for f in backend/*.gs; do cp "$f" /tmp/pmt-security-syntax.js; node --check /tmp/pmt-security-syntax.js; done
      - name: Zero-trust invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'otpRequired' admin/login.html
          grep -q 'otpRequired' public/admin/login.html
          grep -q 'adminLoginOtpVerify' assets/js/admin.js
          grep -q 'adminLoginOtpVerify' public/assets/js/admin.js
          grep -q 'adminBridgeLogin' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/MainActivity.java
          grep -q 'adminBridgeOtpVerify' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/MainActivity.java
          grep -q 'adminBridgeRefresh' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/SmsBridgeService.java
          ! grep -q 'action","adminLogin"' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/MainActivity.java
          ! grep -q 'action","adminLogin"' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/SmsBridgeService.java
          grep -q 'ztCredentialLogin_' backend/ZeroTrustSecurity.gs
          grep -q 'ztVerifyOtp_' backend/ZeroTrustSecurity.gs
          grep -q 'AdminSessions' backend/ZeroTrustSecurity.gs
          grep -q 'AdminAuditLog' backend/ZeroTrustSecurity.gs
          grep -q 'STEP_UP_REQUIRED' backend/ZeroTrustSecurity.gs
          grep -q 'ztRefreshSession_' backend/ZZZZZZZZZZ_ZeroTrustEnforcement.gs
          grep -q 'ZT_ADMIN_ACTIONS' backend/ZZZZZZZZZZ_ZeroTrustEnforcement.gs
          grep -q 'adminLoginOtpVerify' backend/ZZZZZZZZZZZZZZZZZZ_FinalRouter.gs
          grep -q 'adminBridgeRefresh' backend/ZZZZZZZZZZZZZZZZZZ_FinalRouter.gs
          grep -q 'setSafeBrowsingEnabled(true)' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' sms-bridge/app/src/main/java/com/piyare/mobiletelecom/smsbridge/AdminActivity.java
      - name: Android manifest security check
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ns='http://schemas.android.com/apk/res/android'
          root=ET.parse('sms-bridge/app/src/main/AndroidManifest.xml').getroot()
          app=root.find('application')
          if app is None or app.get('{%s}usesCleartextTraffic' % ns) != 'false':
              raise SystemExit('Android cleartext traffic must be explicitly disabled')
          if app.get('{%s}allowBackup' % ns) == 'true':
              raise SystemExit('Android backup must not be enabled for the bridge')
          print('Android manifest security check passed')
      - name: Forbidden OTP literal scan
        shell: python
        run: |
          import pathlib, re
          roots=(pathlib.Path('backend'), pathlib.Path('admin'), pathlib.Path('public/admin'))
          bad=re.compile(r'(?:MASTER.?OTP|UNIVERSAL.?OTP|123456)', re.I)
          hits=[]
          for root in roots:
              for path in root.rglob('*'):
                  if path.suffix.lower() not in {'.gs','.js','.html'} or not path.is_file(): continue
                  try: text=path.read_text(encoding='utf-8', errors='ignore')
                  except OSError: continue
                  for n,line in enumerate(text.splitlines(),1):
                      if bad.search(line): hits.append(f'{path}:{n}:{line.strip()}')
          if hits:
              print('\n'.join(hits)); raise SystemExit('forbidden OTP literal detected')
          print('Forbidden OTP literal scan passed')
      - name: Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p sms-bridge assembleDebug --no-daemon --stacktrace
          test -s sms-bridge/app/build/outputs/apk/debug/app-debug.apk
