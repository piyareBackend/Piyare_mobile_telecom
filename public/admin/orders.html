<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room — Orders</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="customers.html">Customers</a><a href="reports.html">Monthly Reports</a></aside><main class="admin-main"><h1>Orders</h1><p>Customer → order → items → status in one page.</p><section class="cms-section"><div class="admin-actions"><button class="btn" id="refresh">↻ Refresh</button><a class="btn btn-blue" href="reports.html">Monthly report</a></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Customer / ID</th><th>Items</th><th>Total</th><th>Payment</th><th>Status / action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>
const allowed=['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled','Completed'];const later=['Confirmed','Processing','Shipped','Delivered','Cancelled','Completed'];function esc(v){return escapeHtml(v)}async function load(){try{const d=await pmtGet('orders'),a=d?.items||[];rows.innerHTML=a.map(x=>{const items=(x.items||[]).map(i=>`${esc(i.name)}${i.variant?' — '+esc(i.variant):''} × ${Number(i.qty||0)}`).join('<br>');const pending=x.status==='Pending';return `<tr><td><a href="order-detail.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.customer)}</b></a><br><small>${esc(x.id)} · ${esc(x.date||'')}</small></td><td>${items||'—'}</td><td>₹${Number(x.total||0).toLocaleString('en-IN')}</td><td>${esc(x.payment||'—')}</td><td>${pending?'<button class="btn btn-primary" data-act="Confirmed">Confirm</button> <button class="btn" data-act="Rejected">Reject</button>':'<select>'+later.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')+'</select>'}<div data-state style="margin-top:6px;font-size:.78rem;color:var(--gray)"></div></td></tr>`}).join('')||'<tr><td colspan="5">No records yet.</td></tr>';rows.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>change(b.closest('tr'),b.dataset.act));rows.querySelectorAll('select').forEach(s=>s.onchange=()=>change(s.closest('tr'),s.value))}catch(e){rows.innerHTML='<tr><td colspan="5">Unable to load orders.</td></tr>'}}async function change(row,status){const id=row.querySelector('a').href.split('id=')[1];const realId=decodeURIComponent(id);const state=row.querySelector('[data-state]');state.textContent='Saving confirmation…';try{const d=await pmtPost({action:'updateOrder',payload:{id:realId,status}});if(!d?.ok)throw Error(d?.message||'Update failed');const sms=d.sms||{};state.textContent='Confirmation saved · SMS '+String(sms.status||'not queued');await load()}catch(e){state.textContent=e.message||'Update failed'}}refresh.onclick=load;load();</script></body></html>
