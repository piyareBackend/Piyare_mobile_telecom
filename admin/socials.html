<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Social Links — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><div class="admin-nav"><b>📱 PMT Admin</b><a href="dashboard.html">Dashboard</a><a href="editor.html">Page Editor</a><a href="socials.html">Social Links</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="settings.html">Settings</a><a href="#" id="logout">Logout</a></div><main class="admin-wrap"><h1>Footer Social Links</h1><p style="color:var(--gray)">Add only official profile/listing URLs. Toggle each service on or off; enabled links are shown in the public footer and LocalBusiness structured data.</p><div id="msg"></div><section class="cms-section"><div id="socialEditor"></div></section><div style="position:sticky;bottom:0;background:var(--surface);padding:15px 0;margin-top:18px;border-top:1px solid var(--line);display:flex;gap:8px"><button class="btn btn-blue" id="save">💾 Save &amp; Publish</button><a class="btn" href="editor.html">Back to Editor</a></div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script>
const $=id=>document.getElementById(id);const defs={justdial:['Justdial','https://www.justdial.com/Katihar/Piyare-Mobile-Telecom-Dwashay/9999P6452-6452-250401125010-W1X1_BZDET'],google:['Google Business / Share','https://share.google/IO7bQ08OS90EUv95h'],instagram:['Instagram',''],youtube:['YouTube',''],facebook:['Facebook',''],pinterest:['Pinterest','https://in.pinterest.com/piyaremobiletelecom/']};let content;
function esc(v){return escapeHtml(String(v??''))}function render(){const s=content.footer?.socials||{};$('socialEditor').innerHTML=Object.entries(defs).map(([k,d])=>{const x=s[k]||{};const url=String(x.url||d[1]);return `<div class="repeat-row"><div class="form-row"><div class="field"><label>${d[0]} URL</label><input type="url" data-url="${k}" value="${esc(url)}" placeholder="https://..."></div><label style="display:flex;align-items:center;gap:8px;margin-top:28px;white-space:nowrap"><input type="checkbox" data-enabled="${k}" ${x.enabled!==false&&url?'checked':''}> Show in footer</label></div></div>`}).join('')}
async function start(){content=await pmtLoadFreshContent();content.footer=content.footer||{};content.footer.socials=content.footer.socials||{};render()}
$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;try{content.footer=content.footer||{};content.footer.socials={};Object.keys(defs).forEach(k=>{const url=document.querySelector(`[data-url="${k}"]`).value.trim();const enabled=document.querySelector(`[data-enabled="${k}"]`).checked;content.footer.socials[k]={label:defs[k][0],url,enabled};});const d=await pmtPost({action:'saveContent',content});if(!d.ok)throw Error(d.message||'Publish failed');localStorage.setItem('pmt-content',JSON.stringify(content));localStorage.setItem('pmt-content-cache-v3',JSON.stringify({ts:Date.now(),content}));PMT_CONTENT_DATA=content;window.dispatchEvent(new CustomEvent('pmt-content-updated'));$('msg').innerHTML='<div class="panel" style="margin:14px 0">Social links published successfully.</div>'}catch(e){$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message)+'</div>'}finally{btn.disabled=false}};
$('logout').onclick=e=>{e.preventDefault();Admin.logout()};start().catch(e=>$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message)+'</div>');
</script></body></html>
