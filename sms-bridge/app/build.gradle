plugins { id 'com.android.application' }

android {
    namespace 'com.piyare.mobiletelecom.smsbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.piyare.mobiletelecom.smsbridge'
        minSdk 26
        // Keep the bridge on target 34 for the dedicated shop-device APK.
        // Android 15 applies a 6-hour/24-hour dataSync FGS limit to target 35+ apps.
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }
}
