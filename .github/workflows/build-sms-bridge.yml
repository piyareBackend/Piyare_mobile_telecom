name: Build PMT SMS Bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'sms-bridge/**'
      - '.github/workflows/build-sms-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pmt-sms-bridge-debug-apk
          path: sms-bridge/app/build/outputs/apk/debug/app-debug.apk
