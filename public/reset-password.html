<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password — Piyare Mobile Telecom</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/site-polish.css"><style>.auth-wrap{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 18px}.auth-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.auth-card form{display:grid;gap:12px}.auth-card input{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.auth-msg{min-height:24px;color:var(--gray)}</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark"><img src="assets/logo.png" alt="Piyare Mobile Telecom" width="40" height="40"></span> Piyare Mobile Telecom</a></nav></header><main class="auth-wrap"><section class="auth-card"><div class="section-tag">Account recovery</div><h1>Choose a new password</h1><form id="form"><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="New password (10+ characters)"><button class="btn btn-primary">Update password</button></form><p id="msg" class="auth-msg" role="status"></p></section></main><script src="assets/js/customer-account.js"></script><script>const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),msg=document.getElementById('msg');form.onsubmit=async e=>{e.preventDefault();try{const d=await PMTCustomer.post('customerResetPassword',{token,password:document.getElementById('password').value});msg.textContent=d.message;setTimeout(()=>location.replace('login.html'),1200)}catch(x){msg.textContent=x.message}};</script></body></html>
