<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body">
<header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="banners.html">Banners</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Orders</h1><p>Customer → order → status. Confirmation controls are shown only to Owner/staff with <b>Orders — Edit</b>.</p><section class="cms-section"><div class="admin-actions"><button class="btn" id="refresh">↻ Refresh</button></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Customer/ID</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>
(function(){
const canConfirm=(()=>{try{const u=JSON.parse(sessionStorage.getItem('pmt-admin-user')||'{}');return u.role==='Owner'||Array.isArray(u.permissions)&&u.permissions.includes('orders_edit')}catch(e){return false}})();
function esc(v){return window.escapeHtml?escapeHtml(v):String(v==null?'':v)}
async function load(){try{const d=await pmtGet('orders'),a=d?.items||[];rows.innerHTML=a.map(x=>{const control=canConfirm?`<select data-id="${esc(x.id)}">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled','Completed'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="badge">${esc(x.status||'Pending')}</span>`;return `<tr><td>${esc(x.customer)}<br><small>${esc(x.id)}</small></td><td>₹${Number(x.total||0)}</td><td>${esc(x.payment||'—')}</td><td>${control}</td></tr>`}).join('')||'<tr><td colspan="4">No records yet.</td></tr>';if(canConfirm)rows.querySelectorAll('select').forEach(s=>s.onchange=async()=>{try{s.disabled=true;await pmtPost({action:'updateOrder',payload:{id:s.dataset.id,status:s.value}});await load()}catch(e){alert(e.message||'Update failed');await load()}})}catch(e){rows.innerHTML='<tr><td colspan="4">'+esc(e.message||'API request failed')+'</td></tr>'}}
refresh.onclick=load;load();
})();
</script></body></html>
