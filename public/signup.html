<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — Piyare Mobile Telecom</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/site-polish.css"><style>.auth-wrap{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 18px}.auth-card{width:min(500px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.auth-card form{display:grid;gap:12px}.auth-card input{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.auth-msg{min-height:24px;color:var(--gray)}</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark"><img src="assets/logo.png" alt="Piyare Mobile Telecom" width="40" height="40"></span> Piyare Mobile Telecom</a><div class="navlinks"><a href="shop.html">Shop</a><a href="repair.html">Repair</a><a href="contact.html">Contact</a></div></nav></header><main class="auth-wrap"><section class="auth-card"><div class="section-tag">Customer account</div><h1>Create your account</h1><p class="muted">Use one account to keep your orders and repair history together.</p><form id="form"><input id="name" autocomplete="name" maxlength="80" required placeholder="Full name"><input id="email" type="email" autocomplete="email" maxlength="160" required placeholder="Email"><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="Phone (optional)"><input id="password" type="password" autocomplete="new-password" minlength="10" required placeholder="Password (10+ characters)"><button class="btn btn-primary" type="submit">Create account</button></form><p id="msg" class="auth-msg" role="status"></p><p>Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="assets/js/customer-account.js"></script><script>const f=document.getElementById('form'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='Creating account…';try{await PMTCustomer.signup({name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,password:document.getElementById('password').value});m.textContent='Account created. Redirecting…';location.replace('account.html')}catch(x){m.textContent=x.message}};</script></body></html>
